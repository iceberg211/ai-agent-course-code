services:
  elasticsearch:
    build:
      context: .
      dockerfile: docker/elasticsearch/Dockerfile
      args:
        ELASTIC_BASE_IMAGE: docker.m.daocloud.io/elasticsearch:9.3.3
        ELASTIC_VERSION: 9.3.3
    image: digital-human-agent-elasticsearch-ik:9.3.3
    container_name: digital-human-agent-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.m.daocloud.io/kibana:9.3.3
    container_name: digital-human-agent-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: 'false'
    ports:
      - '5601:5601'

  neo4j:
    build:
      context: .
      dockerfile: docker/neo4j/Dockerfile
      args:
        NEO4J_VERSION: ${NEO4J_VERSION:-5.26.26}
        NEO4J_BASE_IMAGE: ${NEO4J_BASE_IMAGE:-digital-human-agent-elasticsearch-ik:9.3.3}
    image: ${NEO4J_IMAGE:-digital-human-agent-neo4j:5.26.26}
    container_name: digital-human-agent-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-12345678}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

volumes:
  elasticsearch-data:
  neo4j-data:
  neo4j-logs:
