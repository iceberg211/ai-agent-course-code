services:
  elasticsearch:
    build:
      context: .
      dockerfile: docker/elasticsearch/Dockerfile
      args:
        ELASTIC_BASE_IMAGE: docker.m.daocloud.io/elasticsearch:9.3.3
        ELASTIC_VERSION: 9.3.3
    image: digital-human-agent-elasticsearch-ik:9.3.3
    container_name: digital-human-agent-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.m.daocloud.io/kibana:9.3.3
    container_name: digital-human-agent-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: 'false'
    ports:
      - '5601:5601'

  neo4j:
    build:
      context: .
      dockerfile: docker/neo4j/Dockerfile
      args:
        NEO4J_VERSION: ${NEO4J_VERSION:-5.26.26}
        NEO4J_BASE_IMAGE: ${NEO4J_BASE_IMAGE:-digital-human-agent-elasticsearch-ik:9.3.3}
    image: ${NEO4J_IMAGE:-digital-human-agent-neo4j:5.26.26}
    container_name: digital-human-agent-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-12345678}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  redis:
    image: docker.m.daocloud.io/redis:7.2-alpine
    container_name: digital-human-agent-redis
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: digital-human-agent-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: digital-human-agent-api:latest
    container_name: digital-human-agent-api
    depends_on:
      - elasticsearch
      - neo4j
      - redis
      - minio
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URL: bolt://neo4j:7687
      S3_ENDPOINT_INTERNAL: http://minio:9000
      S3_ENDPOINT_EXTERNAL: http://localhost:9000
      S3_BUCKET: enterprise-kb
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      DOCUMENT_WORKER_ENABLED: 'false'
      PORT: '3001'
    ports:
      - '3001:3001'
    command: node dist/main.js

  worker:
    image: digital-human-agent-api:latest
    container_name: digital-human-agent-worker
    depends_on:
      - api
      - redis
      - minio
      - elasticsearch
      - neo4j
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URL: bolt://neo4j:7687
      S3_ENDPOINT_INTERNAL: http://minio:9000
      S3_ENDPOINT_EXTERNAL: http://localhost:9000
      S3_BUCKET: enterprise-kb
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      DOCUMENT_WORKER_ENABLED: 'true'
      DOCUMENT_QUEUE_CONCURRENCY: '3'
    command: node dist/worker.main.js

volumes:
  elasticsearch-data:
  neo4j-data:
  neo4j-logs:
  redis-data:
  minio-data:
